<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2 class="auth-title">欢迎回来</h2>
      <p class="auth-subtitle">登录屿物，发现美好</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div *ngIf="error" class="alert alert-error">
        {{ error }}
      </div>

      <div class="form-group">
        <label class="form-label">用户名</label>
        <input 
          type="text" 
          formControlName="username" 
          class="form-control"
          [class.form-error]="f['username'].invalid && (f['username'].dirty || f['username'].touched)"
          placeholder="请输入用户名">
        <div *ngIf="f['username'].invalid && (f['username'].dirty || f['username'].touched)" class="form-error">
          请输入用户名
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">密码</label>
        <input 
          type="password" 
          formControlName="password" 
          class="form-control"
          [class.form-error]="f['password'].invalid && (f['password'].dirty || f['password'].touched)"
          placeholder="请输入密码">
        <div *ngIf="f['password'].invalid && (f['password'].dirty || f['password'].touched)" class="form-error">
          请输入密码
        </div>
      </div>

      <button 
        type="submit" 
        class="btn btn-primary btn-lg btn-block"
        [disabled]="loading || loginForm.invalid">
        <span *ngIf="loading">登录中...</span>
        <span *ngIf="!loading">登录</span>
      </button>
    </form>

    <div class="auth-footer">
      还没有账户？<a routerLink="/register">立即注册</a>
    </div>
  </div>
</div>
